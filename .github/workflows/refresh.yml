name: Update public data

on:
  schedule:
    - cron: "23 2 * * *"
    - cron: "0 4 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check configuration
        id: config
        env:
          AUTOMATION_REPOSITORY: ${{ secrets.AUTOMATION_REPOSITORY }}
          AUTOMATION_DEPLOY_KEY: ${{ secrets.AUTOMATION_DEPLOY_KEY }}
          AUTOMATION_CONFIG_B64: ${{ secrets.AUTOMATION_CONFIG_B64 }}
          AUTOMATION_AUXILIARY_CONFIG_B64: ${{ secrets.AUTOMATION_AUXILIARY_CONFIG_B64 }}
        shell: bash
        run: |
          if [[ -z "$AUTOMATION_REPOSITORY" || -z "$AUTOMATION_DEPLOY_KEY" || -z "$AUTOMATION_CONFIG_B64" || -z "$AUTOMATION_AUXILIARY_CONFIG_B64" ]]; then
            echo "::error::Required private automation configuration is missing."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare automation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.config.outputs.ready == 'true'
        with:
          repository: ${{ secrets.AUTOMATION_REPOSITORY }}
          ssh-key: ${{ secrets.AUTOMATION_DEPLOY_KEY }}
          path: .automation
          fetch-depth: 1
          persist-credentials: false

      - name: Run private automation
        if: steps.config.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_CONFIG_B64: ${{ secrets.AUTOMATION_CONFIG_B64 }}
          AUTOMATION_AUXILIARY_CONFIG_B64: ${{ secrets.AUTOMATION_AUXILIARY_CONFIG_B64 }}
          AUTOMATION_TRIGGER: ${{ github.event.schedule }}
        uses: ./.automation
