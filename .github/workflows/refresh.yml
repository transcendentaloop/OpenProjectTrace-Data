name: Update public data

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "23 2 * * *"
    - cron: "0 4 * * 5"
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      update:
        description: Update set
        required: true
        default: primary
        type: choice
        options: [primary, supplemental, github-window]

permissions:
  contents: write

concurrency:
  group: public-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check configuration
        id: config
        env:
          AUTOMATION_REPOSITORY: ${{ secrets.AUTOMATION_REPOSITORY }}
          AUTOMATION_DEPLOY_KEY: ${{ secrets.AUTOMATION_DEPLOY_KEY }}
          AUTOMATION_CONFIG_B64: ${{ secrets.AUTOMATION_CONFIG_B64 }}
          AUTOMATION_AUXILIARY_CONFIG_B64: ${{ secrets.AUTOMATION_AUXILIARY_CONFIG_B64 }}
          FREELLM_API_KEY: ${{ secrets.FREELLM_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$AUTOMATION_REPOSITORY" || -z "$AUTOMATION_DEPLOY_KEY" || -z "$AUTOMATION_CONFIG_B64" || -z "$AUTOMATION_AUXILIARY_CONFIG_B64" || -z "$FREELLM_API_KEY" ]]; then
            echo "::error::Required private automation configuration is missing."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          repository: ${{ secrets.AUTOMATION_REPOSITORY }}
          ssh-key: ${{ secrets.AUTOMATION_DEPLOY_KEY }}
          path: .automation
          fetch-depth: 1
          persist-credentials: false

      - name: Run private automation
        if: steps.config.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_CONFIG_B64: ${{ secrets.AUTOMATION_CONFIG_B64 }}
          AUTOMATION_AUXILIARY_CONFIG_B64: ${{ secrets.AUTOMATION_AUXILIARY_CONFIG_B64 }}
          FREELLM_API_KEY: ${{ secrets.FREELLM_API_KEY }}
          AUTOMATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.update == 'github-window' && 'github-window' || github.event_name == 'workflow_dispatch' && inputs.update == 'supplemental' && 'supplemental' || github.event_name == 'schedule' && github.event.schedule != '23 2 * * *' && github.event.schedule != '0 4 * * 5' && 'github-window' || 'primary' }}
          GITHUB_WINDOW_SHARD: ${{ github.event.schedule == '0 0 * * *' && '0' || github.event.schedule == '0 5 * * *' && '1' || github.event.schedule == '0 9 * * *' && '2' || github.event.schedule == '0 13 * * *' && '3' || github.event.schedule == '0 17 * * *' && '4' || github.event.schedule == '0 21 * * *' && '5' || github.event.schedule == '0 23 * * *' && '6' || '0' }}
          AUTOMATION_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.update == 'supplemental' && '0 4 * * 5' || github.event.schedule }}
        uses: ./.automation
